<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rattana SAU</title>

    <!-- Tailwind CSS ONLY -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen overflow-x-hidden bg-black text-white">
    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <header class="w-full px-6 py-8 sm:px-10 lg:px-16">
      <nav class="mx-auto flex max-w-7xl items-center justify-between">
        <!-- Logo -->
        <a href="#home" class="text-2xl font-bold tracking-tight sm:text-3xl">
          <span class="text-emerald-400">&gt;_</span>Rattana SAU
        </a>

        <!-- Navigation Links -->
        <div class="hidden items-center gap-8 md:flex">
          <a
            href="#home"
            class="text-sm font-semibold text-yellow-400 transition hover:text-yellow-300"
          >
            Home
          </a>

          <a
            href="#about"
            class="text-sm font-medium text-white transition hover:text-yellow-400"
          >
            About
          </a>

          <!-- Highlight Box for Portfolio -->
          <a
            href="#portfolio"
            class="text-sm font-medium text-white transition hover:text-yellow-400"
          >
            Portfolio
          </a>

          <!-- Pill Button for Let's talk -->
          <a
            href="#contact"
            class="rounded-full border border-white px-6 py-2 text-sm font-medium text-white transition hover:bg-white hover:text-black"
          >
            Let's talk
          </a>
        </div>

        <!-- Mobile Menu Button -->
        <button
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          class="flex h-10 w-10 items-center justify-center rounded-lg border border-white/30 text-white md:hidden"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </nav>
    </header>

    <!-- =====================================================
         HERO SECTION
         ===================================================== -->

    <main id="home">
      <section
        class="mx-auto grid min-h-[calc(100vh-200px)] max-w-7xl items-center gap-12 px-6 pb-12 pt-4 sm:px-10 lg:grid-cols-2 lg:gap-16 lg:px-16"
      >
        <!-- =================================================
                 LEFT CONTENT
                 ================================================= -->

        <div
          class="order-2 flex flex-col items-center text-center lg:order-1 lg:items-start lg:text-left"
        >
          <!-- Main Heading -->
          <h1
            class="max-w-xl font-serif text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl"
          >
            Full Stack Web
            <br />
            Developer !
          </h1>

          <!-- Description -->
          <p class="mt-4 max-w-md text-sm leading-relaxed text-gray-300 sm:text-base">
            Hi, I’m Rattana SAU. A passionate Full Stack
            <br class="hidden sm:block" />
            Web Developer based in Thailand.
          </p>

          <!-- Social Icons -->
          <div class="mt-6 flex items-center gap-4">
            <!-- LinkedIn -->
            <a
              href="#"
              aria-label="LinkedIn"
              class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-black transition hover:scale-110 hover:bg-yellow-400"
            >
              <svg
                class="h-6 w-6"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"
                />
              </svg>
            </a>

            <!-- GitHub -->
            <a
              href="#"
              aria-label="GitHub"
              class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-black transition hover:scale-110 hover:bg-yellow-400"
            >
              <svg
                class="h-6 w-6"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M12 2C6.48 2 2 6.58 2 12.22c0 4.51 2.87 8.34 6.84 9.69.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.2-3.37-1.2-.46-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.58 2.35 1.12 2.93.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.16 9.16 0 0 1 12 8.15c.85 0 1.71.12 2.51.36 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.35 4.8-4.58 5.05.36.32.68.94.68 1.9v2.81c0 .27.18.59.69.49A10.23 10.23 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"
                  clip-rule="evenodd"
                />
              </svg>
            </a>
          </div>
        </div>

        <!-- =================================================
                 PROFILE IMAGE
                 ================================================= -->

        <div class="order-1 flex justify-center lg:order-2 lg:justify-center">
          <div
            class="relative h-72 w-72 overflow-hidden rounded-full sm:h-80 sm:w-80 md:h-96 md:w-96 lg:h-[380px] lg:w-[380px] xl:h-[420px] xl:w-[420px]"
          >
            <img
              src="./images/m2.png"
              alt="Rattana SAU"
              class="h-full w-full object-cover"
            />
          </div>
        </div>
      </section>

      <!-- =====================================================
             TECH STACK SECTION
             ===================================================== -->

      <section
        id="about"
        class="mx-auto max-w-7xl px-6 pb-16 pt-2 sm:px-10 lg:px-16"
      >
        <h2 class="text-center text-sm font-semibold text-white sm:text-base">
          My Tech Stacks
        </h2>

        <!-- Tech Stack Icons -->
        <div
          class="mx-auto mt-6 flex max-w-3xl flex-wrap items-center justify-center gap-6 sm:gap-8"
        >
          <!-- 1. HTML5 -->
          <div class="transition hover:scale-110" title="HTML5">
            <img src="./images/b1.png" alt="HTML5" class="h-10 w-10 object-contain" />
          </div>

          <!-- 2. CSS3 -->
          <div class="transition hover:scale-110" title="CSS3">
            <img src="./images/b2.png" alt="CSS3" class="h-10 w-10 object-contain" />
          </div>

          <!-- 3. JavaScript -->
          <div class="transition hover:scale-110" title="JavaScript">
            <img src="./images/b3.png" alt="JavaScript" class="h-10 w-10 object-contain" />
          </div>

          <!-- 4. Node.js -->
          <div class="transition hover:scale-110" title="Node.js">
            <img src="./images/b4.png" alt="Node.js" class="h-10 w-10 object-contain" />
          </div>

          <!-- 5. React -->
          <div class="transition hover:scale-110" title="React">
            <img src="./images/b5.png" alt="React" class="h-10 w-10 object-contain" />
          </div>

          <!-- 6. Spring -->
          <div class="transition hover:scale-110" title="Spring">
            <img src="./images/b6.png" alt="Spring" class="h-10 w-10 object-contain" />
          </div>

          <!-- 7. Java -->
          <div class="transition hover:scale-110" title="Java">
            <img src="./images/b7.png" alt="Java" class="h-10 w-10 object-contain" />
          </div>

          <!-- 8. Figma -->
          <div class="transition hover:scale-110" title="Figma">
            <img src="./images/b8.png" alt="Figma" class="h-10 w-10 object-contain" />
          </div>

          <!-- 9. Firebase -->
          <div class="transition hover:scale-110" title="Firebase">
            <img src="./images/b9.png" alt="Firebase" class="h-10 w-10 object-contain" />
          </div>
        </div>
      </section>

      <!-- EMPTY ANCHOR SECTIONS -->
      <section id="portfolio" class="h-0"></section>
      <section id="contact" class="h-0"></section>
    </main>
  </body>
</html>
